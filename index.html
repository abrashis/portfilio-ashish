<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ashis Acharya — UI/UX Designer, QA Tester, and Creative Technologist from Biratnagar, Nepal. Portfolio showcasing digital experience design, brand identity, and workflow automation." />
    <title>Ashis Acharya — UI/UX Designer & Creative Technologist</title>
    <!-- Preload critical fonts to avoid FOUT on first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=VT323&display=swap" rel="stylesheet" />
    <style>
      /* ── Inline splash loader ── */
      #app-loader {
        position: fixed; inset: 0;
        background: #f5f3ee;
        background-image: repeating-linear-gradient(transparent, transparent 31px, #d6d3cd 31px, #d6d3cd 32px);
        background-size: 100% 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #app-loader.fade-out { opacity: 0; pointer-events: none; }

      /* Red margin line */
      #app-loader::before {
        content: '';
        position: fixed;
        top: 0; bottom: 0;
        left: 72px;
        width: 2px;
        background: rgba(255, 100, 100, 0.35);
        pointer-events: none;
      }

      /* Sticker pill */
      .loader-pill {
        background: #facc15;
        color: #1a1a1a;
        font-family: 'Caveat', 'Georgia', cursive;
        font-size: 1.55rem;
        font-weight: 700;
        padding: 10px 28px;
        border-radius: 10px;
        border: 2.5px solid #1a1a1a;
        box-shadow: 3px 3px 0 #1a1a1a;
        transform: rotate(-1.5deg);
        letter-spacing: 0.01em;
        animation: pill-pop 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
      }
      @keyframes pill-pop {
        from { opacity: 0; transform: rotate(-1.5deg) scale(0.8); }
        to   { opacity: 1; transform: rotate(-1.5deg) scale(1); }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-Dswn3Fas.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-V7l8w4Ju.css">
  </head>
  <body>
    <!-- ── Splash screen ── -->
    <div id="app-loader">
      <div class="loader-pill">Want to hire me?</div>
    </div>

    <div id="root"></div>

    <!-- ── Splash dismiss after 1s ── -->
    <script>
      (function () {
        var loader = document.getElementById('app-loader');
        function hideLoader() {
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(function () {
              if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
            }, 450);
          }
        }
        setTimeout(hideLoader, 1000);
      })();
    </script>
  </body>
</html>
